name: sharded

# The sharded refresh pipeline (PLAN.md First-principles item 1), written once. refresh.yml calls it with live=true when data/pipeline.json says
# {"sharded": true}; refresh-shadow.yml calls it with live=false (own cache key, build and gates but no release, no publish, no deploy, no commit).
# plan -> N shard jobs (collect only, cache read-only, changed files as an artifact) -> one finish job (restore cache, merge, release, build, gates,
# publish, deploy, save cache). The caller's concurrency group keeps it to one run at a time.
on:
  workflow_call:
    inputs:
      live: {type: boolean, default: false}
      shards: {type: string, default: "20"}
      queue: {type: string, default: "0"}  # shadow only: also collect the first N queued gauges in steady-state mode (timing only)
      cache_prefix: {type: string, default: "rwl-data-"}

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      idx: ${{ steps.p.outputs.idx }}
    steps:
      - id: p
        run: echo "idx=$(python3 -c "import json;print(json.dumps(list(range(${{ inputs.shards }}))))")" >> "$GITHUB_OUTPUT"

  shard:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        i: ${{ fromJSON(needs.plan.outputs.idx) }}
    env:
      USGS_API_KEY: ${{ secrets.USGS_API_KEY }}
      RIDB_API_KEY: ${{ secrets.RIDB_API_KEY }}
      AIRNOW_API_KEY: ${{ secrets.AIRNOW_API_KEY }}
      COLLECT_NEXT: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore the data cache (read only; a shard never saves it)
        uses: actions/cache/restore@v4
        with:
          path: |
            cache
            state
          key: ${{ inputs.cache_prefix }}shard-${{ github.run_id }}-${{ matrix.i }}
          restore-keys: |
            ${{ inputs.cache_prefix }}
            rwl-data-
      - name: Start staggered (3 s per shard, so 20 shards do not open every NOAA connection in the same second)
        run: sleep $(( ${{ matrix.i }} * 3 ))
      - name: Collect this shard
        run: |
          cp -r cache "$RUNNER_TEMP/base"; cp state/source-health.json "$RUNNER_TEMP/base-health.json" 2>/dev/null || echo '{}' > "$RUNNER_TEMP/base-health.json"
          A="--shard=${{ matrix.i }}/${{ inputs.shards }}"
          if [ "${{ inputs.queue }}" != "0" ]; then A="$A --queue=${{ inputs.queue }} --hourly-only"; fi
          python -I collect.py $A --print-sites > "$RUNNER_TEMP/sites.txt"
          echo "shard ${{ matrix.i }}: $(wc -l < "$RUNNER_TEMP/sites.txt") gauges, args $A"
          python -I collect.py $A | tail -n 40
      - name: Compare with the cache it started from, collect the changed files
        run: |
          python -I tools/shadow_compare.py "$RUNNER_TEMP/base" cache "$RUNNER_TEMP/sites.txt" "$RUNNER_TEMP/base-health.json" state/source-health.json "$RUNNER_TEMP/report.json" || true
          mkdir -p out/cache
          while read s; do cp "cache/$s.json" out/cache/ 2>/dev/null || true; done < "$RUNNER_TEMP/sites.txt"
          cp cache/state-*.json out/cache/ 2>/dev/null || true
          cp "$RUNNER_TEMP/report.json" out/report.json || true; cp state/collect-timing.json out/timing.json; cp state/source-health.json out/health.json
      - uses: actions/upload-artifact@v4
        with:
          name: shard-${{ matrix.i }}
          path: out
          retention-days: 2

  finish:
    needs: [plan, shard]
    if: ${{ !cancelled() }}  # a failed shard must not stop the others' work from being published
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      USGS_API_KEY: ${{ secrets.USGS_API_KEY }}
      RIDB_API_KEY: ${{ secrets.RIDB_API_KEY }}
      AIRNOW_API_KEY: ${{ secrets.AIRNOW_API_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Restore the last data cache
        uses: actions/cache/restore@v4
        with:
          path: |
            cache
            state
          key: ${{ inputs.cache_prefix }}${{ github.run_id }}
          restore-keys: |
            ${{ inputs.cache_prefix }}
            rwl-data-
      - name: Keep the committed review signatures (the restored cache holds older ones)
        run: git checkout -- state/reviews && git clean -fdq state/reviews
      - name: Install the pinned wrangler
        run: npm ci --silent
      - uses: actions/download-artifact@v4
        with:
          path: shards
          pattern: shard-*
      - name: Merge the shards' files into the cache (a failed shard keeps its old files and is named here)
        run: |
          python -I tools/merge_shards.py shards ${{ inputs.shards }} | tee merge-out.log
          cat merge-out.log >> "$GITHUB_STEP_SUMMARY"
      - name: Daily release (owner cap 20 gauges/day; first run in the 11:00 UTC hour; collects its own new gauges before the build)
        if: ${{ inputs.live }}
        id: rel
        continue-on-error: true
        run: |
          today=$(date -u +%F); last=$(cat state/last-release.txt 2>/dev/null || true)
          m=$(gh run list --workflow refresh.yml --status success --limit 1 --json startedAt,updatedAt --jq '.[0] | ((.updatedAt|fromdateiso8601) - (.startedAt|fromdateiso8601)) / 60 | floor' 2>/dev/null || echo 0)
          echo "last refresh took ${m} min; last release ${last:-never}"
          if [ "${m:-0}" -gt 45 ]; then echo "release SKIPPED: refresh over 45 min"; exit 0; fi
          if [ "$(date -u +%H)" = "11" ] && [ "$today" != "$last" ]; then
            python -I tools/release.py 20 && python -I tools/open_wave.py 20 --apply && echo "released=1" >> "$GITHUB_OUTPUT"
          fi
      - name: Refresh (build, check, publish, deploy; live=false stops after the gates)
        continue-on-error: true  # same as refresh.yml: publish.py refuses a broken build; health is on /status and in this log
        run: |
          if [ "${{ inputs.live }}" = "true" ]; then python refresh.py --no-collect 2>&1 | tee refresh-out.log; else python -I gates.py 2>&1 | tee refresh-out.log; fi  # practice: every gate, no stop at the first failure, no publish/deploy
      - name: Keep the day's new gauges only if the refresh passed
        if: ${{ inputs.live && steps.rel.outputs.released == '1' }}
        continue-on-error: true
        run: |
          if grep -q "refresh OK" refresh-out.log; then
            git config user.name "riverwaterlevels-bot"; git config user.email "actions@users.noreply.github.com"
            git add data/waves.csv data/index-allow.json legacy/
            git commit -m "daily release: next gauges from picks.csv, every gate passed ($(date -u +%F))"
            git pull --rebase -q origin main && git push origin HEAD:main && date -u +%F > state/last-release.txt && echo "release committed"
          else
            echo "release DROPPED: the refresh did not pass; nothing committed"
          fi
      - name: Save the data cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            cache
            state
          key: ${{ inputs.cache_prefix }}${{ github.run_id }}
