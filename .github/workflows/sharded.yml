name: sharded

# The refresh pipeline (PLAN.md First-principles item 1), written once; refresh.yml is its only caller (the shadow inputs live, queue and cache_prefix
# were deleted 2026-11-10, audit #34: refresh-shadow.yml no longer exists).
# plan -> N shard jobs (collect only, cache read-only, the files they wrote as an artifact) -> one finish job (restore cache, merge, release, build, gates,
# publish, deploy, save cache). The caller's concurrency group keeps it to one run at a time.
on:
  workflow_call:
    inputs:
      shards: {type: string, default: "20"}

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      idx: ${{ steps.p.outputs.idx }}
    steps:
      - id: p
        run: echo "idx=$(python3 -c "import json;print(json.dumps(list(range(${{ inputs.shards }}))))")" >> "$GITHUB_OUTPUT"

  shard:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        i: ${{ fromJSON(needs.plan.outputs.idx) }}
    env:
      USGS_API_KEY: ${{ secrets.USGS_API_KEY }}
      RIDB_API_KEY: ${{ secrets.RIDB_API_KEY }}
      AIRNOW_API_KEY: ${{ secrets.AIRNOW_API_KEY }}
      METOFFICE_SITE_KEY: ${{ secrets.METOFFICE_SITE_KEY }}  # England weather, on whichever shard holds the England page (collect.py my_shard)
      COLLECT_NEXT: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Restore the data cache (read only; a shard never saves it)
        uses: actions/cache/restore@v6
        with:
          path: |
            cache
            state
          key: rwl-data-shard-${{ github.run_id }}-${{ matrix.i }}
          restore-keys: |
            rwl-data-
      - name: Start staggered (3 s per shard, so 20 shards do not open every NOAA connection in the same second)
        run: sleep $(( ${{ matrix.i }} * 3 ))
      - name: Collect this shard (its US gauges and its world pages, collect.py my_shard)
        run: |
          A="--shard=${{ matrix.i }}/${{ inputs.shards }}"
          python -I collect.py $A --print-sites > "$RUNNER_TEMP/sites.txt"
          echo "shard ${{ matrix.i }}: $(wc -l < "$RUNNER_TEMP/sites.txt") gauges, args $A"
          touch "$RUNNER_TEMP/start"
          python -I collect.py $A | tail -n 40; echo "${PIPESTATUS[0]}" > "$RUNNER_TEMP/rc"
      - name: Collect the files this shard wrote (audit 2026-11-10 #36 - every shard re-uploaded the world files it restored, about 600 NOTE lines a run)
        run: |
          mkdir -p out/cache
          while read s; do cp "cache/$s.json" out/cache/ 2>/dev/null || true; done < "$RUNNER_TEMP/sites.txt"
          for f in cache/state-*.json cache/_river-*.json cache/_archive-*.json cache/_ca-*.json cache/_de-*.json cache/_ea-*.json cache/_census.json cache/twdb-texas.json; do
            if [ "$f" -nt "$RUNNER_TEMP/start" ]; then cp "$f" out/cache/; fi
          done
          cp "$RUNNER_TEMP/rc" out/rc; cp state/collect-timing.json out/timing.json; cp state/source-health.json out/health.json
      - uses: actions/upload-artifact@v7
        with:
          name: shard-${{ matrix.i }}
          path: out
          retention-days: 2

  finish:
    needs: [plan, shard]
    if: ${{ !cancelled() }}  # a failed shard must not stop the others' work from being published
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      USGS_API_KEY: ${{ secrets.USGS_API_KEY }}
      RIDB_API_KEY: ${{ secrets.RIDB_API_KEY }}
      AIRNOW_API_KEY: ${{ secrets.AIRNOW_API_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GH_TOKEN: ${{ github.token }}
      WORKERS_PAID: ${{ vars.WORKERS_PAID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Restore the last published pages (rolling rebuild carries unchanged gauge pages from dist/)
        uses: actions/cache/restore@v6
        with:
          path: dist
          key: rwl-pages-${{ github.run_id }}
          restore-keys: |
            rwl-pages-
      - name: Restore the last data cache
        id: datacache
        uses: actions/cache/restore@v6
        with:
          path: |
            cache
            state
          key: rwl-data-${{ github.run_id }}
          restore-keys: |
            rwl-data-
      - name: Keep the committed review signatures (the restored cache holds older ones)
        run: git checkout -- state/reviews && git clean -fdq state/reviews
      - name: Install the pinned wrangler
        run: npm ci --silent
      - uses: actions/download-artifact@v8
        with:
          path: shards
          pattern: shard-*
      - name: Merge the shards' files into the cache (a failed shard keeps its old files and is named here)
        run: |
          python -I tools/merge_shards.py shards ${{ inputs.shards }} | tee merge-out.log
          cat merge-out.log >> "$GITHUB_STEP_SUMMARY"
      - name: Daily release (owner cap 25 gauges/day; first run from 11:00 UTC that has not released today; collects its own new gauges before the build)
        id: rel
        continue-on-error: true
        run: |
          skip() { echo "release SKIPPED: $1"; echo "$1" > state/release-skip.txt; exit 0; }; rm -f state/release-skip.txt
          today=$(date -u +%F); last=$(cat data/last-release.txt 2>/dev/null || true)
          if [ $((10#$(date -u +%H))) -lt 11 ] || [ "$today" = "$last" ]; then echo "no release this run (before 11 UTC, or released today: ${last:-never})"; exit 0; fi  # first run from 11 UTC on that has not released today: GitHub skips most scheduled hours (2026-10-29 had no 11 UTC run)
          # The brakes fail closed (audit 2026-11-10 #32, #40): a number that cannot be read holds the release for this hour; the next run tries again.
          m=$(python -I lib/ledger.py --last-run-min)  # the newest run's own collect + refresh minutes from the run-time ledger, not the worst of two runs in 24 h
          if [ -z "$m" ]; then skip "the last refresh's run time is unknown (no ledger line yet)"; fi
          echo "last refresh took ${m} min; last release ${last:-never}"
          if [ "$m" -gt 45 ]; then skip "the last refresh took ${m} min, over 45"; fi
          cap=${{ vars.WORKERS_PAID && 100000 || 20000 }}  # WORKERS_PAID: repo variable the owner sets after buying the plan
          f=$(curl -s --max-time 20 https://riverwaterlevels.com/status.json | python3 -c "import json,sys; print(int(json.load(sys.stdin).get('files') or 0))" 2>/dev/null) || f=""
          if [ -z "$f" ]; then skip "the live site's status.json did not answer"; fi
          if [ "$f" -gt $((cap * 7 / 10)) ]; then skip "a hard limit is over 70% (files $f of $cap)"; fi  # grow no further until the owner acts
          if [ -z "${{ vars.WORKERS_PAID }}" ]; then  # a stopped run is a reader's error page
            k=$(python -I tools/worker_load.py 2>/dev/null || true)
            if [ -z "$k" ]; then skip "Cloudflare Worker load unreadable (the Cloudflare key needs Account Analytics Read)"; fi
            if [ "$k" -ge 10 ]; then skip "Cloudflare stopped the Worker $k times in 24 h"; fi
          fi
          rem=$(curl -sI --max-time 20 https://riverwaterlevels.com/live/00000000.json | tr -d '\r' | awk 'tolower($1)=="x-rwl-usgs-remaining:"{print int($2)}')
          if [ -n "$rem" ] && [ "$rem" -lt 300 ]; then skip "only $rem USGS calls left this hour"; fi
          python -I tools/world_match.py | head -3 || true
          python -I tools/coast_match.py --apply | grep -v '^skip' | head -5 || true  # PLAN fully automatic d: exact-name NOAA stations join the queue without a session
          python -I tools/release.py 25 && python -I tools/open_wave.py 25 --apply && echo "released=1" >> "$GITHUB_OUTPUT"
      - name: Undo a release that did not complete (its gauges stay queued; the refresh builds yesterday's set)
        if: steps.rel.outputs.released != '1'
        run: git checkout -- data/waves.csv data/index-allow.json data/world-pages.json legacy/ && git clean -fdq legacy/
      - name: Refresh (build, check, publish, deploy)
        continue-on-error: true  # publish.py refuses a broken build; health is on /status and in this log
        env:
          CACHE_MATCHED: ${{ steps.datacache.outputs.cache-matched-key }}  # empty = the restore found no cache: build.py sets status.json cache_lost, the watchdog says "data cache lost" (audit #31)
        run: python refresh.py --no-collect 2>&1 | tee refresh-out.log
      - name: Second try after a failed release (failing new gauges go back to the queue, or the whole release is undone; the site always updates)
        if: ${{ steps.rel.outputs.released == '1' }}
        continue-on-error: true
        env:
          CACHE_MATCHED: ${{ steps.datacache.outputs.cache-matched-key }}
        run: |
          if ! grep -q "refresh OK" refresh-out.log; then
            rm -rf dist  # a failed deploy already published here: pages carried from it link to gauges this try takes back
            python -I tools/quarantine.py || { git checkout -- data/waves.csv data/index-allow.json data/world-pages.json legacy/ && git clean -fdq legacy/; }
            python refresh.py --no-collect 2>&1 | tee refresh-out.log
          fi
      - name: Keep the day's new gauges only if the refresh passed
        if: ${{ steps.rel.outputs.released == '1' }}
        continue-on-error: true
        env:
          GSC_KEY_JSON: ${{ secrets.GSC_KEY_JSON }}  # owner 2026-11-10: Search Console key, sitemap resubmit only
        run: |
          git config user.name "riverwaterlevels-bot"; git config user.email "actions@users.noreply.github.com"
          if grep -q "refresh OK" refresh-out.log && ! git diff --quiet data/waves.csv data/world-pages.json; then
            python -I tools/reindex.py --queue || true  # the day's new pages join the daily Request-indexing queue (one writer: this step)
            date -u +%F > data/last-release.txt; if git diff data/waves.csv | grep -q '^+live,'; then date -u +%F > data/last-success.txt; fi; git add -f docs/research/priority/picks.csv; git add data/reindex-new.txt data/last-success.txt data/coasts.csv data/world-queue.csv data/waves.csv data/index-allow.json data/world-pages.json data/world-ready.csv data/last-release.txt data/open-wave-last.json legacy/
            git commit -m "daily release: next gauges from picks.csv, every gate passed ($(date -u +%F))"
            git pull --rebase --autostash -q origin main && git push origin HEAD:main && echo "release committed"
            python -I tools/indexnow.py --new || true  # tell Bing the pages that just opened; never fails the release
            pip install -q google-api-python-client google-auth >/dev/null 2>&1; python -I tools/gsc_submit.py || true  # tell Google the sitemap changed (needs the service account at Full)
          else  # readiness debate 2026-11-07: the release was undone; its picks wait until tomorrow and today is done, never the same 25 every hour
            echo "release DROPPED: the release was undone or the refresh did not pass"
            git checkout -- data/waves.csv data/index-allow.json data/world-pages.json legacy/ && git clean -fdq legacy/
            python -I tools/release_failed.py "release undone $(date -u +%F), the refresh did not pass with it"
            git add data/waves.csv data/last-release.txt && git commit -m "release failed today: its picks wait until tomorrow ($(date -u +%F))" && git pull --rebase --autostash -q origin main && git push origin HEAD:main && echo "release-failed recorded"
          fi
      - name: Save the published pages (a missing dist/ after a dry run only logs a warning)
        if: always()
        uses: actions/cache/save@v6
        with:
          path: dist
          key: rwl-pages-${{ github.run_id }}
      - name: Did this run pass (a missed restore saves a new cache only after a passing refresh)
        id: passed
        if: always()
        run: grep -q 'refresh OK' refresh-out.log && echo 'ok=1' >> "$GITHUB_OUTPUT" || true
      - name: Save the data cache (a failed restore must not replace the good copy; readiness debate 2026-11-07, a lost cache must not stay lost)
        if: ${{ always() && (steps.datacache.outputs.cache-matched-key != '' || steps.passed.outputs.ok == '1') }}
        uses: actions/cache/save@v6
        with:
          path: |
            cache
            state
          key: rwl-data-${{ github.run_id }}
