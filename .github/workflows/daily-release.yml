name: daily-release

# Adds the next 10 gauges from docs/research/priority/picks.csv every day, entirely in the cloud (owner 2026-10-29: "auto add 10 rivers a day").
# Collect + build the new gauges, open them to Google, run every deploy gate (refresh.py --dry); only if all pass: commit the
# bookkeeping files, save the data cache and start the normal deploy (refresh.yml). Any failure adds nothing and leaves the site as it was.
# Brake: skipped while the last successful refresh took over 45 minutes (scale ceiling, PLAN.md).
on:
  schedule:
    - cron: "10 11 * * *"  # once a day, 11:10 UTC (between hourly refresh runs at :35)
  workflow_dispatch:
    inputs:
      dry:
        description: "true = do everything except commit/deploy"
        required: false
        default: "true"

concurrency:
  group: refresh  # shares the data cache with refresh.yml: one at a time
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      USGS_API_KEY: ${{ secrets.USGS_API_KEY }}
      RIDB_API_KEY: ${{ secrets.RIDB_API_KEY }}
      AIRNOW_API_KEY: ${{ secrets.AIRNOW_API_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GH_TOKEN: ${{ github.token }}
      DRY: ${{ github.event_name == 'workflow_dispatch' && inputs.dry || 'false' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Restore the last data cache
        uses: actions/cache/restore@v4
        with:
          path: |
            cache
            state
          key: rwl-release-${{ github.run_id }}
          restore-keys: |
            rwl-data-
      - name: Keep the committed review signatures
        run: git checkout -- state/reviews && git clean -fdq state/reviews
      - name: Install the pinned wrangler
        run: npm ci --silent
      - name: Brake (last refresh over 45 min = skip today)
        id: brake
        run: |
          m=$(gh run list --workflow refresh.yml --status success --limit 1 --json startedAt,updatedAt --jq '.[0] | ((.updatedAt|fromdateiso8601) - (.startedAt|fromdateiso8601)) / 60 | floor')
          echo "last refresh took ${m} min"
          if [ "${m:-0}" -gt 45 ]; then echo "skip=1" >> "$GITHUB_OUTPUT"; echo "SKIPPED: refresh too slow for more gauges"; fi
      - name: Add 10 gauges, open them, run every gate
        id: rel
        if: steps.brake.outputs.skip != '1'
        continue-on-error: true  # no red runs, no owner email; the verdict is the "refresh OK" line
        run: |
          set -o pipefail
          python -I tools/release.py 10 2>&1 | tee release.log
          python -I tools/open_wave.py 10 --apply 2>&1 | tail -3
          python refresh.py --dry 2>&1 | tail -40 | tee gates.log
          grep -q "refresh OK" gates.log && echo "ok=1" >> "$GITHUB_OUTPUT"
      - name: Commit and deploy (only when every gate passed)
        if: steps.rel.outputs.ok == '1' && env.DRY != 'true'
        run: |
          git config user.name "riverwaterlevels-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/waves.csv data/index-allow.json
          git commit -m "daily release: next gauges from picks.csv, all gates passed ($(date -u +%F))"
          git push origin HEAD:main
          echo "committed"
      - name: Save the data cache with the new gauges
        if: steps.rel.outputs.ok == '1' && env.DRY != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            cache
            state
          key: rwl-data-${{ github.run_id }}
      - name: Start the deploy
        if: steps.rel.outputs.ok == '1' && env.DRY != 'true'
        run: gh workflow run refresh.yml --ref main
