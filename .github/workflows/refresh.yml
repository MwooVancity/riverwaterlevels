name: refresh

# Rebuilds and deploys the site without the owner's computer. Started hourly by the Worker cron (worker/index.js build(), when the build is
# over 40 min old); the schedule below is the backup. The work is in sharded.yml: N collect shards, then one merge + release + build + gates +
# publish + deploy job. The single-job copy of that pipeline was deleted 2026-11-10 (audit #34): it never ran, and its steps drifted from the live ones.
on:
  push:
    branches: [main]  # every push runs the gates and, only if they pass, deploys (repo audit 2026-10-20: a push never ran a gate before)
    paths-ignore: ["**.md", "docs/**"]  # a docs push must not cancel the pending data run (sweep 2026-10-21)
  schedule:
    - cron: "35 * * * *"
  workflow_dispatch:

# one run at a time: two runs would overwrite each other's data
concurrency:
  group: refresh
  cancel-in-progress: false

permissions:
  contents: write  # the daily release commits data/waves.csv and data/index-allow.json
  actions: read

jobs:
  # data/pipeline.json {"shards": N}: how many collect jobs. A scheduled run skips itself when the live site was built under 40 min ago (audit #39:
  # the backup schedule landed minutes after a Worker-started run and rebuilt the same data). Unreadable status.json = run: the site must update.
  plan:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.p.outputs.shards }}
      go: ${{ steps.p.outputs.go }}
    steps:
      - uses: actions/checkout@v7
      - id: p
        run: |
          n=$(python3 -c "import json; print(int(json.load(open('data/pipeline.json'))['shards']))") || n=16
          echo "shards=$n" >> "$GITHUB_OUTPUT"
          go=true
          if [ "${{ github.event_name }}" = "schedule" ]; then
            age=$(curl -s --max-time 20 https://riverwaterlevels.com/status.json | python3 -c "import json, sys, datetime; b = datetime.datetime.fromisoformat(json.load(sys.stdin)['built_at']); print(int((datetime.datetime.now(datetime.timezone.utc) - b).total_seconds() // 60))" 2>/dev/null) || age=""
            if [ -n "$age" ] && [ "$age" -lt 40 ]; then go=false; echo "scheduled run skipped: the live site was built $age min ago"; fi
          fi
          echo "go=$go" >> "$GITHUB_OUTPUT"

  sharded:
    needs: plan
    if: ${{ needs.plan.outputs.go == 'true' }}
    uses: ./.github/workflows/sharded.yml
    secrets: inherit
    with:
      shards: ${{ needs.plan.outputs.shards }}
