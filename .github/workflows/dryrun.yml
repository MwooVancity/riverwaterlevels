name: dryrun

# A practice run before anything reaches the live site (owner 2026-10-29: "stop fucking up so much"): every gate of the real
# deploy, run on the cloud's own last data, on any branch except main. It never collects, saves the cache, publishes or deploys.
# Use: push the change to branch "check", read this run's log for "refresh OK", then push the same commit to main.
on:
  push:
    branches-ignore: [main]
  schedule:
    - cron: "10 3 * * *"  # nightly practice release (owner 2026-11-07): tomorrow's picks through every gate; failing picks go back to the queue before 11:00
  workflow_dispatch:
    inputs:
      release:
        description: "true = also practise the daily release (20 gauges), commits nothing"
        required: false
        default: "false"
      review:
        description: "site ids to collect, build and screenshot at phone width for a review (space separated); the shots are this run's artifact, nothing on the laptop"
        required: false
        default: ""
      speed:
        description: "live page paths to measure on a phone (Lighthouse mobile, performance only; space separated, e.g. /river/x/y/); scores print in the log"
        required: false
        default: ""

concurrency:
  group: dryrun-${{ github.event_name }}-${{ github.event_name == 'push' && github.sha || github.run_id }}  # code review 2026-11-09: a review dispatch on the same commit cancelled the push run and its promote; fresh review 2026-11-09: one group for all runs cancelled the earlier push's gate, so sessions pushed one change at a time
  cancel-in-progress: true

permissions:
  contents: write  # the nightly practice commits data/waves.csv (the gates of picks that failed); a passing push to check is promoted to main
  actions: write  # promote: start refresh.yml on main (a push made with this token starts no workflow by itself)

jobs:
  dryrun:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      USGS_API_KEY: ${{ secrets.USGS_API_KEY }}
      RIDB_API_KEY: ${{ secrets.RIDB_API_KEY }}
      AIRNOW_API_KEY: ${{ secrets.AIRNOW_API_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Every workflow file parses (a bad one stops running with no job and no log)
        run: |
          pip install -q pyyaml
          python -c "import glob, yaml; [yaml.safe_load(open(f, encoding='utf-8')) for f in glob.glob('.github/workflows/*.yml')]; print('workflows parse')"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Restore the cloud's last data (read only)
        uses: actions/cache/restore@v6
        with:
          path: |
            cache
            state
          key: rwl-dry-${{ github.run_id }}
          restore-keys: |
            rwl-data-
      - name: Keep the committed review signatures
        run: git checkout -- state/reviews && git clean -fdq state/reviews
      - name: Install the pinned wrangler
        run: npm ci --silent
      - name: Practice daily release (nightly, or on demand)
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.release == 'true')
        continue-on-error: true
        run: python -I tools/release.py 25 --every-kind && python -I collect.py --world-only && python -I tools/open_wave.py 40 --apply  # one page of every kind too (owner 2026-11-08), so a new kind meets every gate before the real release
      - name: Every gate, no deploy
        continue-on-error: true  # no red runs, no owner email; the verdict is the "refresh OK" line
        run: python refresh.py --dry 2>&1 | tee refresh-out.log
      - name: Review screenshots in the cloud (owner 2026-11-08 laptop minimum; PLAN fully automatic c)
        if: github.event_name == 'workflow_dispatch' && inputs.review != ''
        continue-on-error: true
        env:
          SITES: ${{ inputs.review }}
        run: |
          LIVE=""
          if [ -z "$(printf '%s\n' $SITES | grep -v '^/')" ]; then  # only page paths (a world page, 2026-11-09): shoot the deployed page, no collect or build
            LIVE="--live"; echo "review of live paths: $SITES" > .review-check.txt
          else
            python -I collect.py $SITES > review-collect.log 2>&1 || tail -5 review-collect.log
            RWL_REVIEW=1 python -I build.py $SITES | tail -2  # PLAN 20: the review build shows new block types the live site still hides
            python -I check.py dist_next 2>&1 | tail -20 > .review-check.txt || true
          fi
          npm i --no-save --silent playwright@1.49.1 && npx playwright install --with-deps chromium > /dev/null
          node tools/hater_shots.mjs $SITES $LIVE
          mkdir -p .cache/review && cp .review-check.txt .cache/review/check.txt
      - name: Phone speed of live pages (drawing board 8; the PageSpeed API quota ran out 2026-11-08)
        if: github.event_name == 'workflow_dispatch' && inputs.speed != ''
        continue-on-error: true  # a page or Chrome failure never turns the dry run red
        env:
          PATHS: ${{ inputs.speed }}
        run: |
          for p in $PATHS; do
            npx -y lighthouse@12.2.1 "https://riverwaterlevels.com$p" --quiet --only-categories=performance --chrome-flags="--headless=new --no-sandbox" --output=json --output-path=lh.json || { echo "speed $p: Lighthouse failed"; continue; }
            python3 -I tools/lh_line.py lh.json "$p"
          done
      - name: Upload the review screenshots
        if: github.event_name == 'workflow_dispatch' && inputs.review != ''
        uses: actions/upload-artifact@v7
        with:
          name: review
          path: .cache/review
          retention-days: 3
      - name: Nightly practice keeps only the gates of picks that failed (the real release never meets them)
        if: github.event_name == 'schedule'
        continue-on-error: true
        run: |
          grep -q "refresh OK" refresh-out.log || python -I tools/quarantine.py || echo "practice: the failure was not a new page; nothing sent back"
          python -I tools/practice_keep.py
          git config user.name "riverwaterlevels-bot"; git config user.email "actions@users.noreply.github.com"
          if ! git diff --quiet data/waves.csv; then
            git add data/waves.csv && git commit -m "practice release: picks that failed go back to the queue until tomorrow ($(date -u +%F))" && git pull --rebase --autostash -q origin main && git push origin HEAD:main && echo "practice gates committed"
          fi
      - name: "Promote a passing push on check to main and deploy (fresh review 2026-11-09, sessions stopped to wait 25 min for this chain)"
        if: github.event_name == 'push' && github.ref == 'refs/heads/check'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! grep -q "refresh OK" refresh-out.log; then echo "promote: no refresh OK, main untouched"; exit 0; fi
          git config user.name "riverwaterlevels-bot"; git config user.email "actions@users.noreply.github.com"
          git checkout -q -- . && git clean -fdq -e refresh-out.log
          git fetch -q --unshallow origin 2>/dev/null || true  # full history only here (the checkout stays shallow for every other run)
          for try in 1 2 3; do  # two runs promoting at once: the loser fetches the winner's main and tries again (code review 2026-11-09)
            git fetch -q origin main
            if ! git merge -q --no-edit origin/main; then git merge --abort; echo "promote skipped: check and main conflict, a session merges"; exit 0; fi
            if git push -q origin HEAD:main; then gh workflow run refresh.yml --ref main && echo "promoted $(git rev-parse --short HEAD) to main; refresh started"; exit 0; fi
            sleep 20
          done
          echo "PROMOTE FAILED after 3 tries: main moved; a session pushes main"
