name: watchdog

# Hourly site doctor (owner 2026-10-25: no alarms, no emails). tools/watchdog.py reads the live site, prints one health report and
# heals what it can: a site not rebuilt for 60 min gets a refresh dispatched here (unless one is already queued or running); stale edge
# readings are refreshed by requesting a page. It never fails the run. Problems it cannot heal are read at session start.
on:
  schedule:
    - cron: "17 */6 * * *"  # backup only (audit 2026-11-10 #39): the Worker cron dispatches this every hour at :00 (24 of 24 hours on 11-10); this catches a dead Worker or an expired GH_DISPATCH_TOKEN
  workflow_dispatch:
    inputs:
      test_keepalive:
        description: "Add the keep-alive empty commit now"
        type: boolean
        default: false

permissions:
  contents: write  # only the keep-alive commit below
  actions: write   # to dispatch refresh.yml when the site stopped rebuilding

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # tools/rollback.py compares the live build's commit with main
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - id: doctor
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WORKERS_PAID: ${{ vars.WORKERS_PAID }}
          GSC_KEY_JSON: ${{ secrets.GSC_KEY_JSON }}  # the daily Search Console access check (12 UTC only); the key is read from the environment, never printed
        run: |
          if [ "$(date -u +%H)" = "12" ]; then pip install -q google-api-python-client google-auth >/dev/null 2>&1 || true; fi
          python tools/watchdog.py | tee watchdog-out.txt
      - name: Heal - roll our own code back to the live build's version when new code has failed every refresh for 3 h (tools/rollback.py; once, then a person)
        id: rollback
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -I tools/rollback.py --apply
      - name: Heal - dispatch a refresh when the site stopped rebuilding
        if: steps.doctor.outputs.heal == 'refresh' || steps.rollback.outputs.rolled == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          busy=$(gh run list --workflow=refresh.yml --json status --jq '[.[] | select(.status=="queued" or .status=="in_progress" or .status=="pending")] | length' -L 10)
          if [ "$busy" = "0" ]; then gh workflow run refresh.yml && echo "refresh dispatched"; else echo "a refresh is already queued or running ($busy)"; fi
      # audit 2026-11-10 #12: their MISMATCH and FAULT lines go into watchdog-out.txt, so the dashboard step below lists them; a crash is a PROBLEM line there too
      - name: Live numbers against USGS and NWS (onto the dashboard)
        continue-on-error: true
        timeout-minutes: 5
        env:
          USGS_API_KEY: ${{ secrets.USGS_API_KEY }}
        run: |
          rc=0; timeout 270 python tools/truth_live.py > tl.txt 2>&1 || rc=$?
          cat tl.txt; cat tl.txt >> watchdog-out.txt
          if ! grep -q '^truth_live: ' tl.txt; then echo "  PROBLEM: truth_live printed no result (exit $rc): live pages were not compared with USGS/NWS this hour (this step's log)" | tee -a watchdog-out.txt; fi
      - name: World gauge pages against their feed (onto the dashboard)
        continue-on-error: true
        timeout-minutes: 4
        env:
          USGS_API_KEY: ${{ secrets.USGS_API_KEY }}
        run: |
          rc=0; timeout 210 python tools/truth_world.py > tw.txt 2>&1 || rc=$?
          cat tw.txt; cat tw.txt >> watchdog-out.txt
          if ! grep -q '^world truth: ' tw.txt; then echo "  PROBLEM: truth_world printed no result (exit $rc): world pages were not compared with their agency this hour (this step's log)" | tee -a watchdog-out.txt; fi
      - name: Owner dashboard (this run's Summary tab; tools/ops_summary.py)
        continue-on-error: true
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -I tools/ops_summary.py watchdog-out.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the schedules on (GitHub turns them off after 60 days with no commit; the daily release normally commits)
        run: |
          if [ $(( $(date +%s) - $(git log -1 --format=%ct) )) -gt 3888000 ] || [ "${{ github.event.inputs.test_keepalive }}" = "true" ]; then
            git config user.name "riverwaterlevels-bot"; git config user.email "actions@users.noreply.github.com"
            git commit --allow-empty -m "keep schedules on: no commit for 45 days" && git push origin HEAD:main
          fi
      # Owner 2026-11-07: no failure emails. The watchdog never fails on purpose; problems are read from its report at session start.
