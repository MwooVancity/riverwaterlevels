name: watchdog

# Hourly check of the LIVE site. It records health to the logs and the /status page; it never fails the run (continue-on-error), so it never emails the owner.
# Checks: the live build is older than 3 hours, readings are stale, or the page count dropped below the floor (tools/watchdog.py),
# and whether any gauge page disagrees with USGS (flow, stage, time) or NWS (flood stages): tools/truth_live.py.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/watchdog.py
        continue-on-error: true  # log health, never fail the run (no owner email); read it on /status
      - name: Truth against USGS and NWS (every gauge page)
        continue-on-error: true
        run: python tools/truth_live.py
