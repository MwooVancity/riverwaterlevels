name: watchdog

# Hourly check of the LIVE site. A failure makes GitHub email the repository owner.
# Fails when the live build is older than 3 hours, the readings are stale, or the page count dropped below the floor in tools/watchdog.py.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/watchdog.py
