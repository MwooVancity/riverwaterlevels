name: watchdog

# Hourly site doctor (owner 2026-10-25: no alarms, no emails). tools/watchdog.py reads the live site, prints one health report and
# heals what it can: a site not rebuilt for 60 min gets a refresh dispatched here (unless one is already queued or running); stale edge
# readings are refreshed by requesting a page. It never fails the run. Problems it cannot heal are read at session start.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      test_alarm:
        description: "Send a test failure email to the owner"
        type: boolean
        default: false

permissions:
  contents: write  # only the keep-alive commit below
  actions: write   # to dispatch refresh.yml when the site stopped rebuilding

jobs:
  watch:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: doctor
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python tools/watchdog.py
      - name: Heal - dispatch a refresh when the site stopped rebuilding
        if: steps.doctor.outputs.heal == 'refresh'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          busy=$(gh run list --workflow=refresh.yml --json status --jq '[.[] | select(.status=="queued" or .status=="in_progress" or .status=="pending")] | length' -L 10)
          if [ "$busy" = "0" ]; then gh workflow run refresh.yml && echo "refresh dispatched"; else echo "a refresh is already queued or running ($busy)"; fi
      - name: Live numbers against USGS and NWS (log only)
        continue-on-error: true
        timeout-minutes: 5
        env:
          USGS_API_KEY: ${{ secrets.USGS_API_KEY }}
        run: python tools/truth_live.py
      - name: World gauge pages against their feed
        id: truth
        continue-on-error: true
        timeout-minutes: 4
        run: python tools/truth_world.py
      - name: One alarm per half day (the first run in 01-06 or 13-18 UTC; GitHub skips most single hours)
        id: clock
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          h=$((10#$(date -u +%H) % 12))
          if [ "$h" -ge 1 ] && [ "$h" -le 6 ]; then
            sent=$(gh run list --workflow watchdog.yml --event schedule --status failure --created ">=$(date -u -d "-$h hours" +%FT%H:00:00Z)" --json databaseId --jq length || echo 0)
            if [ "$sent" = "0" ]; then echo "open=1" >> "$GITHUB_OUTPUT"; fi
          fi
      - name: Keep the schedules on (GitHub turns them off after 60 days with no commit; the daily release normally commits)
        run: |
          if [ $(( $(date +%s) - $(git log -1 --format=%ct) )) -gt 3888000 ]; then
            git config user.name "riverwaterlevels-bot"; git config user.email "actions@users.noreply.github.com"
            git commit --allow-empty -m "keep schedules on: no commit for 45 days" && git push origin HEAD:main
          fi
      - name: Owner alarm (at most twice a day, reader-visible problems only; the failed run makes GitHub email the owner)
        if: github.event.inputs.test_alarm == 'true' || (steps.clock.outputs.open == '1' && (steps.doctor.outputs.alarm != '' || steps.truth.outcome == 'failure'))
        env:
          ALARM: "${{ steps.doctor.outputs.alarm || (steps.truth.outcome == 'failure' && 'A world page differs from its agency, see the truth step') || '' }}"
        run: |
          echo "::error::River site problem a reader can see: ${ALARM:-TEST ONLY, nothing is wrong}"
          exit 1
